function openWeChatModal(event) {

  }

// QQ模态框功能
function openQQModal(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  closeAllModals();
  const modal = document.getElementById('qq-modal');
  if (modal) {

  }
}

function closeQQModal() {
  const modal = document.getElementById('qq-modal');
  if (modal) {
    modal.style.display = 'none';
  }
}

// 关闭所有模态框
function closeAllModals() {
  const modals = ['email-modal', 'wechat-modal', 'qq-modal', 'phone-modal'];
  modals.forEach(modalId => {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.style.display = 'none';
    }
  });
}

// Phone 模态框功能
function openPhoneModal(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  closeAllModals();
  const modal = document.getElementById('phone-modal');
  if (modal) {
    modal.style.display = 'flex';
  }
}

function closePhoneModal() {
  const modal = document.getElementById('phone-modal');
  if (modal) {
    modal.style.display = 'none';
  }
}

// 初始化功能
document.addEventListener('DOMContentLoaded', function() {
  // 复制功能（支持 data-email 或 data-phone）
  document.querySelectorAll('.copy-button').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const email = this.getAttribute('data-email');
      const phone = this.getAttribute('data-phone');
      const textToCopy = email || phone || '';
      if (!textToCopy) return;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalHTML = this.innerHTML;
        this.innerHTML = '<i class="fa fa-check"></i> Copied!';
        setTimeout(() => {
          this.innerHTML = originalHTML;
        }, 2000);
      });
    });
  });
  
  // 点击模态框外部关闭
  document.querySelectorAll('.contact-modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === this) {
        closeAllModals();
      }
    });
  });
  
  // ESC键关闭模态框
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeAllModals();
    }
  });
});
