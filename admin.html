<title>学术主页管理面板</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --success: #3fb950;
  --warning: #d29922;
  --radius: 8px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); display:flex; height:100vh; overflow:hidden; }

/* Sidebar */
.sidebar { width:220px; background:var(--bg-secondary); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { padding:20px 16px; border-bottom:1px solid var(--border); }
.sidebar-header h1 { font-size:16px; color:var(--accent); }
.sidebar-header p { font-size:12px; color:var(--text-secondary); margin-top:4px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; border-left:3px solid transparent; transition:all .2s; color:var(--text-secondary); font-size:14px; }
.nav-item:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.nav-item.active { background:var(--bg-tertiary); color:var(--accent); border-left-color:var(--accent); }
.nav-item .emoji { font-size:18px; width:24px; text-align:center; }
.sidebar-footer { margin-top:auto; padding:12px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-secondary); }

/* Main */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar { display:flex; align-items:center; justify-content:space-between; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--bg-secondary); }
.toolbar h2 { font-size:18px; }
.toolbar-actions { display:flex; gap:8px; }
.content { flex:1; overflow-y:auto; padding:24px; }

/* Buttons */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer; font-size:13px; font-family:var(--font); transition:all .2s; }
.btn:hover { border-color:var(--text-secondary); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-danger:hover { opacity:.85; }
.btn-success { background:var(--success); border-color:var(--success); color:#fff; }
.btn-sm { padding:5px 10px; font-size:12px; }

/* Forms */
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width:100%; padding:8px 12px; background:var(--bg-primary); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text-primary); font-size:13px; font-family:var(--font); transition:border-color .2s;
}
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
textarea { min-height:120px; resize:vertical; }

/* Cards */
.card { background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.card-title { font-size:15px; font-weight:600; }
.card-meta { font-size:12px; color:var(--text-secondary); margin-top:4px; }
.card-actions { display:flex; gap:6px; flex-shrink:0; }
.badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; }
.badge-blue { background:#1f6feb33; color:var(--accent); }
.badge-green { background:#23863633; color:var(--success); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
.modal-overlay.show { display:flex; }
.modal { background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; width:90%; max-width:700px; max-height:85vh; display:flex; flex-direction:column; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:16px; }
.modal-close { background:none; border:none; color:var(--text-secondary); font-size:20px; cursor:pointer; padding:4px; }
.modal-close:hover { color:var(--text-primary); }
.modal-body { padding:20px; overflow-y:auto; flex:1; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border); }

/* Export Modal */
.export-content { background:var(--bg-primary); border:1px solid var(--border); border-radius:var(--radius); padding:12px; font-family:'Cascadia Code','Fira Code',monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; max-height:400px; overflow-y:auto; color:var(--text-secondary); }
.export-tabs { display:flex; gap:0; margin-bottom:12px; }
.export-tab { padding:8px 16px; cursor:pointer; border:1px solid var(--border); background:var(--bg-tertiary); color:var(--text-secondary); font-size:13px; }
.export-tab:first-child { border-radius:var(--radius) 0 0 var(--radius); }
.export-tab:last-child { border-radius:0 var(--radius) var(--radius) 0; }
.export-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Toast */
.toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; background:var(--success); color:#fff; border-radius:var(--radius); font-size:13px; z-index:200; opacity:0; transform:translateY(10px); transition:all .3s; }
.toast.show { opacity:1; transform:translateY(0); }

/* Checkbox */
.checkbox-label { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; }
.checkbox-label input { width:16px; height:16px; accent-color:var(--accent); }

/* Empty state */
.empty-state { text-align:center; padding:48px; color:var(--text-secondary); }
.empty-state .emoji { font-size:48px; margin-bottom:12px; }
.empty-state p { margin-bottom:16px; }

/* Section */
.section-title { font-size:14px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* Split View */
.split-view { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:stretch; }
.split-pane { display:flex; flex-direction:column; }
.split-pane textarea { flex:1; min-height:300px; resize:vertical; }
.md-preview { background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius); padding:16px; font-size:13px; line-height:1.7; overflow-y:auto; flex:1; min-height:300px; }
.md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4 { margin:12px 0 6px; color:var(--accent); }
.md-preview strong { color:#79c0ff; }
.md-preview li { margin-left:16px; margin-bottom:4px; }
.md-preview a { color:var(--accent); text-decoration:underline; }

/* Rich Editor */
.editor-toolbar { display:flex; gap:2px; padding:6px; background:var(--bg-tertiary); border:1px solid var(--border); border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; flex-wrap:wrap; }
.editor-toolbar button { background:none; border:1px solid transparent; color:var(--text-secondary); padding:4px 8px; cursor:pointer; border-radius:4px; font-size:13px; font-family:var(--font); }
.editor-toolbar button:hover { background:var(--bg-primary); border-color:var(--border); color:var(--text-primary); }
.rich-editor { background:var(--bg-primary); border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); padding:12px; min-height:200px; max-height:400px; overflow-y:auto; font-size:13px; line-height:1.7; color:var(--text-primary); outline:none; }
.rich-editor:focus { border-color:var(--accent); }
.rich-editor img { max-width:100%; height:auto; border-radius:4px; margin:8px 0; border:1px solid var(--border); }
.rich-editor b,.rich-editor strong { color:#79c0ff; }

/* Button Config */
.btn-config-list { display:flex; flex-wrap:wrap; gap:6px; padding:8px 0; }
.btn-config-item { display:flex; align-items:center; gap:4px; padding:4px 10px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:16px; font-size:12px; cursor:grab; user-select:none; transition:all .2s; }
.btn-config-item.enabled { border-color:var(--accent); background:#1f6feb22; }
.btn-config-item .drag-handle { cursor:grab; color:var(--text-secondary); }
.btn-config-item input[type=checkbox] { width:14px; height:14px; accent-color:var(--accent); margin:0; }
.btn-config-item.dragging { opacity:0.5; }
</style>
</head>

function loadStore() {
  // 优先使用 sync_admin.ps1 生成的实时文件数据
  if (window.PRELOADED_RAW) {

      localStorage.setItem(STORE_KEY, JSON.stringify(parsed));

    } catch(e) { console.error('解析预加载数据失败:', e); }

  try { const d = JSON.parse(localStorage.getItem(STORE_KEY)); return d || defaultStore(); }
  catch { return defaultStore(); }

// ============================================================
// 从真实文件内容解析数据
// ============================================================
function parsePreloadedData(raw) {
  const data = defaultStore();

  // 解析 About 页面 —— 提取 frontmatter 之后的正文
  function extractBody(md) {
    const m = md.match(/^---[\s\S]*?---\s*(.*)$/s);
    return m ? m[1].trim() : md;
  }
  function extractStatCards(body) {
    const gpa = body.match(/stat-value\">([^<]*)<\/div>\s*<div class=\"stat-label\">GPA/)?.[1] || '4.10/5.00';
    const rank = body.match(/stat-value\">([^<]*)<\/div>\s*<div class=\"stat-label\">(Rank|排名)/)?.[1] || '2/123';
    const cet4 = body.match(/stat-value\">([^<]*)<\/div>\s*<div class=\"stat-label\">CET-4/)?.[1] || '551';
    const cet6 = body.match(/stat-value\">([^<]*)<\/div>\s*<div class=\"stat-label\">CET-6/)?.[1] || '570';
    return { gpa, rank, cet4, cet6 };
  }
  function extractTextContent(body) {
    // 移除 stat-cards HTML 块（使用 div 计数法精确匹配）
    let result = body;
    const startIdx = result.indexOf('<div class="stat-cards-container">');
    if (startIdx !== -1) {
      let depth = 0, i = startIdx;
      while (i < result.length) {
        if (result.substring(i).startsWith('<div')) { depth++; i = result.indexOf('>', i) + 1; }
        else if (result.substring(i).startsWith('</div>')) { depth--; if (depth === 0) { i += 6; break; } else { i += 6; } }
        else { i++; }
      }
      result = result.substring(0, startIdx) + result.substring(i);
    }
    // 移除中文包裹 div
    result = result.replace(/<div id="content-zh"[^>]*markdown="1">/g, '');
    result = result.replace(/<\/div>\s*$/g, '');
    return result.trim();
  }

  if (raw.about_en) {
    const body = extractBody(raw.about_en);
    const stats = extractStatCards(body);
    data.about.gpa = stats.gpa;
    data.about.rank = stats.rank;
    data.about.cet4 = stats.cet4;
    data.about.cet6 = stats.cet6;
    data.about.content_en = extractTextContent(body);
  }
  if (raw.about_zh) {
    const body = extractBody(raw.about_zh);
    data.about.content_zh = extractTextContent(body);
  }

  // 解析 publications
  if (raw.bib) {
    data.pubs = parseBib(raw.bib);
    if (raw.intros && Array.isArray(raw.intros)) {
      raw.intros.forEach(intro => {
        const match = intro.name.match(/^(.+?)(_zh)?\.md$/);
        if (match) {
          const key = match[1];
          const isZh = !!match[2];
          const pub = data.pubs.find(p => p.key === key);
          if (pub) {
            if (isZh) {
              pub.preview_content_zh = intro.content;
            } else {
              pub.preview_content = intro.content;
            }
          }
        }
      });
    }
  }

  // 解析 news —— 按文件名配对中英文
  if (raw.news && raw.news.length) {
    const newsMap = {};
    raw.news.forEach(f => {
      const isZh = f.name.endsWith('_zh.md');
      const prefix = f.name.replace(/_zh\.md$/, '').replace(/\.md$/, '');
      if (!newsMap[prefix]) newsMap[prefix] = { prefix, date:'', content_en:'', content_zh:'' };
      // 提取日期
      const dateMatch = f.content.match(/date:\s*(\d{4}-\d{2}-\d{2})/);
      if (dateMatch) newsMap[prefix].date = dateMatch[1];
      // 提取正文（frontmatter 之后）
      const bodyMatch = f.content.match(/^---[\s\S]*?---\s*(.*)$/s);
      const content = bodyMatch ? bodyMatch[1].trim() : '';
      if (isZh) newsMap[prefix].content_zh = content;
      else newsMap[prefix].content_en = content;
    });
    data.news = Object.values(newsMap).sort((a,b) => a.date > b.date ? -1 : 1);
  }

  // 解析 resume.json + resume_zh.json
  if (raw.resume_en) {
    const r = raw.resume_en;
    if (r.basics) {
      data.cv.basics.name = r.basics.name || '';
      data.cv.basics.email = r.basics.email || '';
      data.cv.basics.phone = r.basics.phone || '';
      data.cv.basics.summary = r.basics.summary || '';
    }
    if (r.education) data.cv.education = r.education;
    if (r.work) data.cv.work = r.work;
    if (r.skills) data.cv.skills = r.skills;
    if (r.languages) data.cv.languages = r.languages;
    if (r.interests) data.cv.interests = r.interests;
    if (r.awards) {
      data.awards = r.awards.map(a => ({
        title: a.title||'', title_zh: '', date: a.date||'',
        awarder: a.awarder||'', awarder_zh: '', url: a.url||''
      }));
    }
  }
  if (raw.resume_zh) {
    const r = raw.resume_zh;
    if (r.basics) {
      data.cv.basics.name_zh = r.basics.name || '';
      data.cv.basics.summary_zh = r.basics.summary || '';
    }
    if (r.awards && data.awards.length) {
      r.awards.forEach((a, i) => {
        if (data.awards[i]) {
          data.awards[i].title_zh = a.title || '';
          data.awards[i].awarder_zh = a.awarder || '';
        }
      });
    }
  }

  // 解析 projects（配对中英文文件）
  if (raw.projects && raw.projects.length) {
    const projMap = {};
    raw.projects.forEach(f => {
      const isZh = f.name.endsWith('_zh.md');
      const prefix = f.name.replace(/_zh\.md$/, '').replace(/\.md$/, '');
      if (!projMap[prefix]) projMap[prefix] = { title:'', title_zh:'', description:'', description_zh:'', img:'', category:'', content:'', content_zh:'', filename: prefix };
      const fm = f.content.match(/^---([\s\S]*?)---/s)?.[1] || '';
      const body = f.content.match(/^---[\s\S]*?---\s*(.*)$/s)?.[1]?.trim() || '';
      if (isZh) {
        projMap[prefix].title_zh = fm.match(/title:\s*(.*)/)?.[1]?.trim() || '';
        projMap[prefix].description_zh = fm.match(/description:\s*(.*)/)?.[1]?.trim() || '';
        projMap[prefix].content_zh = body;
      } else {
        projMap[prefix].title = fm.match(/title:\s*(.*)/)?.[1]?.trim() || '';
        projMap[prefix].description = fm.match(/description:\s*(.*)/)?.[1]?.trim() || '';
        projMap[prefix].img = (fm.match(/img:\s*(.*)/)?.[1]?.trim() || '').replace(/^assets\/img\//, '');
        projMap[prefix].category = fm.match(/category:\s*(.*)/)?.[1]?.trim() || '';
        projMap[prefix].content = body;
      }
    });
    data.projects = Object.values(projMap);
  }

  return data;
}

function showZhChanges() {
  const baseline = store.about._baseline_zh || '';
  const current = gv('ab_zh') || store.about.content_zh || '';
  if (baseline === current) {
    toast('中文内容未变更');
    return;
  }
  // 简单行级 diff
  const oldLines = baseline.split('\n');
  const newLines = current.split('\n');
  let diffText = '━━ 中文 About 页面变更记录 ━━\n';
  diffText += '请根据以下中文修改，对应更新英文版本。\n\n';
  diffText += '【当前英文内容】\n' + (store.about.content_en || gv('ab_en')) + '\n\n';
  diffText += '【中文修改前】\n' + baseline + '\n\n';
  diffText += '【中文修改后】\n' + current + '\n\n';
  // 高亮变更行
  diffText += '【变更摘要】\n';
  const maxLen = Math.max(oldLines.length, newLines.length);
  let changeCount = 0;
  for (let i = 0; i < maxLen; i++) {
    const o = oldLines[i] || '';
    const n = newLines[i] || '';
    if (o !== n) {
      changeCount++;
      if (o && n) diffText += `第${i+1}行 修改:\n  旧: ${o}\n  新: ${n}\n`;
      else if (!o) diffText += `第${i+1}行 新增: ${n}\n`;
      else diffText += `第${i+1}行 删除: ${o}\n`;
    }
  }
  diffText += `\n共 ${changeCount} 处变更。`;

  openModal('📝 中文变更 → 英文翻译提示',
    `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">复制以下内容发给 AI 助手，即可自动更新英文版本</div>
    <div class="export-content" id="zh_diff_content">${esc(diffText)}</div>`,
    `<button class="btn btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('zh_diff_content').textContent).then(()=>toast('已复制！粘贴给我即可'))">\ud83d\udccb 复制全部</button>
    <button class="btn btn-success" onclick="store.about._baseline_zh=gv('ab_zh')||store.about.content_zh;store.about._baseline_en=gv('ab_en')||store.about.content_en;saveStore();closeModal();toast('基线已重置')">\u2705 标记为已同步</button>
    <button class="btn" onclick="closeModal()">关闭</button>`
  );
}

function handleCVPdf(lang) {
  const input = document.getElementById('cv_pdf_' + lang);
  const file = input.files[0];
  if (!file) return;
  const filename = lang === 'en' ? 'cv_english.pdf' : 'cv_chinese.pdf';
  const reader = new FileReader();
  reader.onload = function(e) {
    // Store in memory for download
    const blob = new Blob([e.target.result], {type: 'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    toast('已下载 ' + filename + '，请将其移动到 assets/pdf/ 目录');
  };
  reader.readAsArrayBuffer(file);
}

// ============================================================
// BibTeX Parser & Generator
// ============================================================
function parseBib(text) {
  const entries = []; const re = /@(\w+)\s*\{([^,]*),/g; let m;
  while ((m = re.exec(text)) !== null) {
    const type = m[1], key = m[2].trim();
    let depth = 1, start = m.index + m[0].length, i = start;
    while (i < text.length && depth > 0) { if (text[i]==='{') depth++; else if (text[i]==='}') depth--; i++; }
    const body = text.substring(start, i - 1);
    const fields = {}; fields.type = type; fields.key = key;
    const fre = /(\w+)\s*=\s*(?:\{((?:[^{}]|\{[^{}]*\})*)\}|"([^"]*)"|(\w+))/g; let fm;
    while ((fm = fre.exec(body)) !== null) {
      fields[fm[1]] = fm[2] !== undefined ? fm[2] : (fm[3] !== undefined ? fm[3] : fm[4]);
    }
    if (fields.selected) fields.selected = fields.selected === 'true';
    if (fields.bibtex_show) fields.bibtex_show = fields.bibtex_show === 'true';
    entries.push(fields);
  }
  return entries;
}

function genBib(pubs) {
  let out = '---\n---\n\n';
  pubs.forEach(p => {
    out += `@${p.type||'inproceedings'}{${p.key},\n`;
    const fields = ['abbr','title','title_zh','author','abstract','abstract_zh','preview_content','preview_content_zh','year','journal','booktitle','note','note_zh','doi','arxiv','pdf','code','slides','website','html','supp','video','poster','blog','preview','button_order'];
    fields.forEach(f => { if (p[f]) out += `  ${f}={${p[f]}},\n`; });
    if (p.bibtex_show) out += `  bibtex_show={true},\n`;
    if (p.selected) out += `  selected={true},\n`;
    out += `}\n\n`;
  });
  return out;
}

function exportPubs() {
  const files = [];
  const pubsCopy = JSON.parse(JSON.stringify(store.pubs));
  
  // Extract intros into separate files and remove them from the bibtex
  pubsCopy.forEach(p => {
    if (p.preview_content && p.preview_content.trim() !== '') {
      files.push({ name: `_includes/intros/${p.key}.md`, content: p.preview_content });
    }
    if (p.preview_content_zh && p.preview_content_zh.trim() !== '') {
      files.push({ name: `_includes/intros/${p.key}_zh.md`, content: p.preview_content_zh });
    }
    delete p.preview_content;
    delete p.preview_content_zh;
  });

  files.unshift({name:'papers.bib (_bibliography/papers.bib)', content:genBib(pubsCopy)});
  showExport(files);
}

function showExport(files) {
  let tabs = files.map((f,i) => `<span class="export-tab ${i===0?'active':''}" onclick="switchExportTab(this,${i})">${f.name}</span>`).join('');
  let body = `<div class="export-tabs">${tabs}</div>`;
  files.forEach((f,i) => { body += `<div class="export-content" id="exp_${i}" style="${i>0?'display:none':''}">${esc(f.content)}</div>`; });
  openModal('导出文件', body, files.map((f,i) =>
    `<button class="btn btn-sm" onclick="copyExport(${i})">📋 复制 ${f.name.split(' ')[0]}</button>`
  ).join('') + `<button class="btn" onclick="closeModal()">关闭</button>`);
  window._exportFiles = files;
}

function switchExportTab(el, idx) {
  el.parentElement.querySelectorAll('.export-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.export-content').forEach((c,i) => c.style.display = i===idx?'':'none');
}

function copyExport(i) {
  navigator.clipboard.writeText(window._exportFiles[i].content).then(() => toast('已复制到剪贴板！'));
}

function doImport() {
  const type = gv('imp_type'), content = gv('imp_content');
  try {
    if (type === 'bib') {
      const pubs = parseBib(content);
      store.pubs = pubs;
      toast(`成功导入 ${pubs.length} 篇论文`);
    } else if (type === 'resume_en') {
      const j = JSON.parse(content);
      if (j.basics) { store.cv.basics.name = j.basics.name||''; store.cv.basics.email = j.basics.email||''; store.cv.basics.summary = j.basics.summary||''; }
      if (j.awards) store.awards = j.awards.map(a => ({title:a.title,date:a.date,awarder:a.awarder,url:a.url||'',title_zh:'',awarder_zh:''}));
      if (j.skills) store.cv.skills = j.skills;
      if (j.languages) store.cv.languages = j.languages;
      if (j.interests) store.cv.interests = j.interests;
      toast('简历数据已导入');
    } else if (type === 'resume_zh') {
      const j = JSON.parse(content);
      if (j.basics) { store.cv.basics.name_zh = j.basics.name||''; store.cv.basics.summary_zh = j.basics.summary||''; }
      if (j.awards) store.awards.forEach((a,i) => { if(j.awards[i]) { a.title_zh=j.awards[i].title||''; a.awarder_zh=j.awards[i].awarder||''; }});
      toast('中文简历数据已导入');
    }
    saveStore(); closeModal(); render();
  } catch(e) { toast('导入失败: ' + e.message); }
}

// ============================================================
// Utilities
// ============================================================
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gv(id) { const el=document.getElementById(id); return el?el.value:''; }

// ============================================================
// Markdown Renderer (simple)
// ============================================================
function renderMd(text) {
  if (!text) return '';
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^#### (.*)/gm, '<h4>$1</h4>')
    .replace(/^### (.*)/gm, '<h3>$1</h3>')
    .replace(/^## (.*)/gm, '<h2>$1</h2>')
    .replace(/^# (.*)/gm, '<h1>$1</h1>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)(?:\{[^}]*\})?/g, '<a href="$2">$1</a>')
    .replace(/^- (.*)/gm, '<li>$1</li>')
    .replace(/· /g, ' · ');
  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

// Rich Editor Helpers

function editorCmd(cmd, val) {
  document.execCommand(cmd, false, val || null);
}

function insertEditorImage() {
  window._activeEditorId = document.activeElement.id === 'pf_intro_zh' ? 'pf_intro_zh' : 'pf_intro';
  document.getElementById('pf_img_input')?.click();
}

function handleEditorFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = `<img src="${e.target.result}" style="max-width:100%">`;
    document.getElementById('pf_intro')?.focus();
    document.execCommand('insertHTML', false, img);
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function initRichEditor() {
  const editor = document.getElementById('pf_intro');
  if (!editor) return;
  editor.addEventListener('paste', function(e) {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (let item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        const reader = new FileReader();
        reader.onload = function(ev) {
          document.execCommand('insertHTML', false, `<img src="${ev.target.result}" style="max-width:100%">`);
        };
        reader.readAsDataURL(file);
        return;
      }
    }
  });
}

// ============================================================
// Button Drag & Drop
// ============================================================
function toggleBtnItem(checkbox) {
  const item = checkbox.closest('.btn-config-item');
  item.classList.toggle('enabled', checkbox.checked);
}

function initBtnDrag() {
  const list = document.getElementById('btnConfigList');
  if (!list) return;
  let dragEl = null;
  list.querySelectorAll('.btn-config-item').forEach(item => {
    item.addEventListener('dragstart', function(e) {
      dragEl = this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      dragEl = null;
    });
    item.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (dragEl && dragEl !== this) {
        const rect = this.getBoundingClientRect();
        const mid = rect.left + rect.width / 2;
        if (e.clientX < mid) {
          list.insertBefore(dragEl, this);
        } else {
          list.insertBefore(dragEl, this.nextSibling);
        }
      }
    });
  });
}

// ============================================================
// 全局变更追踪
// ============================================================
function showGlobalChanges() {
  let baseline;
  try { baseline = JSON.parse(localStorage.getItem('admin_baseline')); }
  catch { toast('无基线数据'); return; }
  if (!baseline) { toast('无基线数据，请重新同步'); return; }

  let report = '━━ 全站中文内容变更报告 ━━\n';
  report += '请根据以下中文修改，对应更新英文版本。\n\n';
  let totalChanges = 0;

  function diffField(section, label, oldVal, newVal, enVal) {
    oldVal = oldVal || ''; newVal = newVal || '';
    if (oldVal === newVal) return '';
    totalChanges++;
    let d = `--- [${section}] ${label} ---\n`;
    if (enVal) d += `当前英文: ${enVal}\n`;
    d += `中文修改前: ${oldVal.substring(0,200)}${oldVal.length>200?'...':''}\n`;
    d += `中文修改后: ${newVal.substring(0,200)}${newVal.length>200?'...':''}\n\n`;
    return d;
  }

  // About
  report += diffField('关于页面', '中文简介', baseline.about?.content_zh, store.about?.content_zh, store.about?.content_en);

  // Publications
  (store.pubs||[]).forEach((p, i) => {
    const bp = baseline.pubs?.[i] || {};
    report += diffField(`论文: ${p.title||p.key}`, '中文标题', bp.title_zh, p.title_zh, p.title);
    report += diffField(`论文: ${p.title||p.key}`, '中文摘要', bp.abstract_zh, p.abstract_zh, p.abstract);
    report += diffField(`论文: ${p.title||p.key}`, '中文备注', bp.note_zh, p.note_zh, p.note);
    report += diffField(`论文: ${p.title||p.key}`, '中文Intro', bp.preview_content_zh, p.preview_content_zh, '');
  });

  // Projects
  (store.projects||[]).forEach((p, i) => {
    const bp = baseline.projects?.[i] || {};
    report += diffField(`项目: ${p.title||p.filename}`, '中文标题', bp.title_zh, p.title_zh, p.title);
    report += diffField(`项目: ${p.title||p.filename}`, '中文描述', bp.description_zh, p.description_zh, p.description);
    report += diffField(`项目: ${p.title||p.filename}`, '中文正文', bp.content_zh, p.content_zh, '');
  });

  // CV
  report += diffField('简历', '中文姓名', baseline.cv?.basics?.name_zh, store.cv?.basics?.name_zh, store.cv?.basics?.name);
  report += diffField('简历', '中文简介', baseline.cv?.basics?.summary_zh, store.cv?.basics?.summary_zh, store.cv?.basics?.summary);

  // Awards
  (store.awards||[]).forEach((a, i) => {
    const ba = baseline.awards?.[i] || {};
    report += diffField('奖项', `中文标题: ${a.title}`, ba.title_zh, a.title_zh, a.title);
    report += diffField('奖项', `中文颁发机构: ${a.title}`, ba.awarder_zh, a.awarder_zh, a.awarder);
  });

  // News
  (store.news||[]).forEach((n, i) => {
    const bn = baseline.news?.[i] || {};
    report += diffField(`新闻: ${n.date}`, '中文内容', bn.content_zh, n.content_zh, n.content_en);
  });

  if (totalChanges === 0) {
    toast('所有中文内容未变更');
    return;
  }

  report += `\n━━ 共 ${totalChanges} 处变更 ━━`;

  openModal('📝 全站中文变更报告 (' + totalChanges + ' 处)',
    `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">复制以下内容发给 AI 助手，即可自动更新英文版本</div>
    <div class="export-content" id="global_diff_content">${esc(report)}</div>`,
    `<button class="btn btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('global_diff_content').textContent).then(()=>toast('已复制！粘贴给我即可'))">📋 复制全部</button>
    <button class="btn btn-success" onclick="localStorage.setItem('admin_baseline',JSON.stringify(store));closeModal();toast('基线已重置！当前状态已保存为新基线')">✅ 标记为已同步</button>
    <button class="btn" onclick="closeModal()">关闭</button>`
  );
}
